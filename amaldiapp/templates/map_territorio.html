{% extends "base.html" %}


{% block head %}
{{ super() }}

    <style>
    html, body {
        height: 100%;
    }
    
    body {
        position: relative;
        padding-bottom: 200px; /* Altezza approssimativa del footer */
        /*min-height: 100vh;*/
    }
    
    .footer {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: auto; /* O un'altezza fissa se preferisci */
    }
    </style>

{% endblock %}


{% block app_content %}

	<div class="row">

		<div style="position: relative; width: 100%; padding-top: 56.25%;">
            <iframe 
                src="https://www.google.com/maps/d/u/0/embed?mid=1F2CST1jGl8lDnp3gN6An_aDfbiva5tA&ehbc=2E312F&noprof=1" 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
                allowfullscreen>
            </iframe>
        </div>

	</div>

{% endblock %}
